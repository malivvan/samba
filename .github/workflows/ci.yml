# The one CI workflow: the unit/integration suite, the per-platform facility
# suite, the race detector, lint, coverage, fuzzing, the cross-platform builds,
# the SMB client interop suite, and the tagged release.
#
# A note on the test matrix, because what runs where is a deliberate decision
# rather than a convenience.
#
# The server needs four facilities from the host that pure Go does not provide —
# sharing a listening port, watching a directory, locking a byte range, moving
# file bytes to a socket — plus the file metadata, timestamps and filesystem
# sizes the protocol reports. They live in pkg/, one implementation per platform
# and a documented fallback for the rest (the README support table is the map),
# so the *platform-specific* code is the pkg/ tree:
#
#   * `test` runs everything on Linux: the whole suite, race detector, the
#     interop suite and the release gate are here, because Linux is the platform
#     with all four mechanisms native.
#   * `platform` runs `go test ./pkg/...` on macOS and Windows, which *executes*
#     kqueue, sendfile(2), fstatfs, futimes(2), ReadDirectoryChangesW,
#     LockFileEx and the FILE_FS_SIZE_INFORMATION path rather than only compiling
#     them. This leg gates: a platform-specific regression is a regression.
#   * `cross-build` compiles and `go vet`s the whole module — tests included, so
#     the test files must be portable too — for the BSDs and the other
#     architectures, which cannot be run on a GitHub-hosted runner. Their code is
#     compile-verified, not runtime-verified, and the README says so instead of
#     implying otherwise.
#
# No third-party action is used for the BSD legs. Booting a real FreeBSD/OpenBSD/
# NetBSD VM (vmactions/*) would execute them, and it is the obvious next step,
# but it means adding an unreviewed third-party action to a CI that this project
# treats as part of its supply chain. That trade-off is recorded in
# docs/TESTING.md and ROADMAP.md rather than taken unilaterally here.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC: the long fuzz run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an older run of the same ref. Tag runs are never
  # cancelled: a release must finish once it has started.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build, test and race-test the whole module — the package and cmd —
  # on each of the three desktop platforms.
  test:
    name: test (linux, full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Build (static, CGO disabled)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
      - name: Test
        run: go test ./...
      - name: Test under the race detector
        run: go test -race ./...
      # The mechanism this platform is supposed to have, asserted rather than
      # assumed: a build that silently landed on a fallback would otherwise pass
      # every test above.
      - name: Platform facilities
        run: |
          go run ./cmd --list-platform
          out=$(go run ./cmd --list-platform)
          for want in SO_REUSEPORT inotify OFD splice; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::linux lost the $want mechanism"; exit 1 ;;
            esac
          done

  # The per-platform facility suite. Running it — rather than only compiling for
  # these platforms — is what catches a regression in kqueue, in ReadDirectory-
  # ChangesW, in LockFileEx, in the POSIX lock fallback or in the file-metadata
  # mappings, none of which Linux exercises.
  platform:
    name: platform facilities (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # The repository stores every text file with LF (.gitattributes), because
      # gofmt compares bytes and a CRLF checkout would report every Go file as
      # unformatted — which is exactly what the Windows runner's core.autocrlf
      # does. The attribute file is what fixes this for a checkout of any kind;
      # this step pins the same policy for this job so the gate below cannot
      # depend on the order Git happened to read the attributes in.
      - name: Store text files with LF
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet (everything, tests included)
        run: go vet ./...
      - name: Build (static, CGO disabled)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
      - name: Test the platform facilities
        run: go test ./pkg/...
      - name: Report the mechanisms this platform actually got
        shell: bash
        run: go run ./cmd --list-platform

  # golangci-lint (.golangci.yml) plus the source-level invariants that make the
  # rest of the security posture meaningful.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: .golangci.yml is schema v2, and a lint gate that changes
          # under you is not a gate. Bump this and the config together.
          version: v2.14.0
          args: --timeout=5m
      - name: Pure Go only (no CGO, no unsafe)
        shell: bash
        run: |
          set -eu
          # A change that reaches for a C library or unsafe must be re-thought,
          # not exempted: this package is pure Go by design.
          if grep -rn --include='*.go' -E 'import +"C"|"unsafe"' . \
              | grep -v '_test.go' | grep -v '^\./docs/'; then
            echo "::error::CGO or unsafe usage found in a shipping file"
            exit 1
          fi

  # Coverage is generated on every run and only *sent* on a push: a pull
  # request from a fork has no access to the Coveralls secret.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...
      - name: Total
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload the profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: Send to Coveralls
        if: github.event_name != 'pull_request'
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
        env:
          # actions-goveralls wraps mattn/goveralls, which reads the repository
          # token from $COVERALLS_TOKEN. The secret is named after Coveralls'
          # own convention (COVERALLS_REPO_TOKEN), so map it across. The
          # official coverallsapp/github-action cannot be used here: it
          # authenticates with the GitHub token and ignores the repo token.
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  # Every fuzz target, one job each, so a crasher names the target it came from.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzProcessFrame, FuzzNTLM, FuzzClassifyBlob, FuzzParseLeaseCtx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz ${{ matrix.target }}
        env:
          # A push gets a smoke; the weekly scheduled run gets the long one.
          FUZZTIME: ${{ github.event_name == 'schedule' && '15m' || '60s' }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME" .
      - name: Upload the crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore

  # Drive the built server with Samba's own client: the dialect matrix, file
  # operations, authentication and SMB3 encryption. This is the closest thing
  # to a real deployment that can run in CI.
  interop:
    name: interop (smbclient)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install smbclient
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient
      - name: SMB client interop
        run: |
          CGO_ENABLED=0 go build -trimpath -o ./samba ./cmd
          ./bench/interop-smbclient.sh ./samba

  cross-build:
    name: cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform whose facilities are supposed to be native, plus the
          # architectures whose field widths differ (a 32-bit BSD is where the
          # uint32 kevent ident and the 32-bit Statvfs_t live), plus Solaris as
          # the one platform that takes every fallback path at once.
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: 386 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: netbsd, goarch: arm }
          - { goos: dragonfly, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: solaris, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `go vet` type-checks the test files too, so this is also what keeps the
      # suite portable: a test that reaches for a Linux-only syscall fails here
      # rather than in someone's tree.
      - name: Build and vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath ./...
          go vet ./...

  # A tag publishes a release, but only once lint, coverage, the tests (with the
  # race detector) and the fuzzers have passed. `needs` makes that an implicit
  # gate: if any of them fails or is skipped, this job is skipped too and no
  # release is created.
  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, coverage, test, platform, cross-build, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The tag must match samba.Version
        shell: bash
        run: |
          set -eu
          declared="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' doc.go)"
          if [ -z "$declared" ]; then
            echo "::error::could not read Version from doc.go"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match samba.Version $declared (doc.go)"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches samba.Version $declared"
      - name: Build the static binaries
        shell: bash
        run: |
          set -eu
          mkdir -p out
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "out/samba-linux-$arch" ./cmd
          done
          # The binary is static: there are no library dependencies at all,
          # which is the point of keeping the module CGO-free.
          file out/samba-linux-amd64
      - name: Smoke test the binary
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/shares/data
          cat > /tmp/samba.toml <<'INI'
          listen = "127.0.0.1:8445"
          [[share]]
          name = "data"
          path = "/tmp/shares/data"
          INI
          ./out/samba-linux-amd64 --version
          ./out/samba-linux-amd64 --check --config /tmp/samba.toml
      - name: Benchmarks
        shell: bash
        run: |
          set -eu
          go test -run '^$' -bench . -benchmem -benchtime 1s -count 1 . | tee bench.txt
      - name: Compose the release description
        shell: bash
        run: |
          set -eu
          {
            echo "## Benchmarks"
            echo
            echo '`go test -run "^$" -bench . -benchmem -benchtime 1s .` on the release runner'
            echo "($(nproc) cores, $(go version), $(date -u +%F)). The throughput column comes"
            echo 'from the benchmarks that call `b.SetBytes`; the rest are per-message costs.'
            echo
            echo '```'
            grep -E '^(goos|goarch|pkg|cpu|Benchmark|PASS|ok|FAIL)' bench.txt
            echo '```'
          } > release-body.md
          cat release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          # The action prepends body_path to the auto-generated notes, so the
          # benchmark block leads and the commit list follows.
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
