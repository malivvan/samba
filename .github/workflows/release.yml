name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build static binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          mkdir -p out
          go build -trimpath -ldflags="-s -w" -o "out/samba-${{ matrix.goarch }}" ./cmd/samba
          # The binary is static: there are no library dependencies at all,
          # which is the point of keeping the module CGO-free.
          file "out/samba-${{ matrix.goarch }}"
      - name: Smoke test the binary
        if: matrix.goarch == 'amd64'
        run: |
          set -e
          mkdir -p /tmp/shares/data
          cat > /tmp/samba.toml <<INI
          listen = "127.0.0.1:8445"
          [[share]]
          name = "data"
          path = "/tmp/shares/data"
          INI
          ./out/samba-amd64 --version
          ./out/samba-amd64 --check --config /tmp/samba.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
